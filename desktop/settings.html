<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'" />
    <title>HomeHub Settings</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }

      * { box-sizing: border-box; }
      body { margin: 0; }
      .dialog { padding: 24px; }
      h2 { margin: 0 0 18px; font-size: 24px; }
      .field { margin-bottom: 14px; }
      label { display: block; color: #94a3b8; margin-bottom: 8px; }
      input[type="text"], input[type="password"] {
        width: 100%;
        background: #020817;
        border: 1px solid #334155;
        border-radius: 10px;
        color: #f8fafc;
        padding: 10px 12px;
      }
      .checkbox-field { display: flex; align-items: center; gap: 10px; }
      .checkbox-field label { margin: 0; color: #f8fafc; }
      .error { color: #fca5a5; min-height: 1.25em; }
      .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
      button { border: 1px solid #334155; border-radius: 10px; padding: 10px 16px; font: inherit; cursor: pointer; }
      .secondary { background: #1f2937; color: #f8fafc; }
      .primary { background: #2563eb; border-color: #2563eb; color: white; }
      button:disabled { opacity: 0.6; cursor: wait; }
    </style>
  </head>
  <body>
    <main class="dialog">
      <h2>Hub Settings</h2>
      <div class="field">
        <label for="settingsUrl">Hub URL</label>
        <input id="settingsUrl" type="text" value="http://192.168.1.50:8321" autocomplete="url" />
      </div>
      <div class="field">
        <label for="settingsToken">Hub token</label>
        <input id="settingsToken" type="password" value="" autocomplete="off" />
      </div>
      <div class="field checkbox-field">
        <input id="launchAtLogin" type="checkbox" />
        <label for="launchAtLogin">Launch HomeHub when I sign in</label>
      </div>
      <div id="settingsError" class="error" role="alert"></div>
      <div class="actions">
        <button class="secondary" id="cancelBtn" type="button">Cancel</button>
        <button class="primary" id="saveBtn" type="button">Save</button>
      </div>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
